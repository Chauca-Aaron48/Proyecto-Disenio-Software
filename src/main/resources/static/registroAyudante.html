<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Registrar Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { --sgp-blue: #0f52ba; }
        body { background-color: #f4f6f9; }

        .navbar-sgp { background-color: var(--sgp-blue); }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }

        /* Estilos Tarjetas de Selección (Roles) */
        .role-selector { cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .role-selector:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Efecto cuando se selecciona un rol */
        .btn-check:checked + .card {
            border-color: var(--sgp-blue);
            background-color: #f0f7ff;
        }
        .btn-check:checked + .card .text-primary { font-weight: bold; }

        /* Estilos Generales Formulario */
        .card-form { border: none; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-label { font-weight: 600; font-size: 0.9rem; color: #555; }
        
        .btn-save { background-color: var(--sgp-blue); color: white; padding: 10px 30px; }
        .btn-save:hover { background-color: #0b45a0; color: white; }

        /* Clase para ocultar secciones */
        .hidden-section { display: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-sgp mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-4" href="indexDocente.html">
                <i class="bi bi-arrow-left me-2 fs-5"></i>SGP Académico
            </a>
            <div class="d-flex text-white align-items-center ms-auto">
                <span class="me-3">Dr. Juan Pérez</span>
                <i class="bi bi-person-circle fs-3"></i>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="max-width: 900px;">
        
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="indexDocente.html">Inicio</a></li>
                <li class="breadcrumb-item"><a href="listaAyudantes.html">Ayudantes</a></li>
                <li class="breadcrumb-item active fw-bold" aria-current="page">Nuevo Ingreso</li>
            </ol>
        </nav>

        <h2 class="fw-bold text-dark mb-4">Registrar Nuevo Personal</h2>

        <form onsubmit="guardarAyudante(event)">
            
            <div class="card card-form p-4 mb-4">
                <h5 class="text-primary border-bottom pb-2 mb-4">1. Asignación de Proyecto</h5>
                <div class="mb-2">
                    <label class="form-label">Seleccione el Proyecto Activo <span class="text-danger">*</span></label>
                    <select class="form-select form-select-lg" id="selectProyecto" required>
                        <option value="" selected disabled>-- Seleccione un proyecto --</option>
                        <option value="INV-24-01">Sistema de IA para detección (INV-24-01) - [2 Cupos Disp.]</option>
                        <option value="VIN-23-15">Alfabetización Digital Rural (VIN-23-15) - [1 Cupo Disp.]</option>
                    </select>
                    <div class="form-text mt-2">
                        <i class="bi bi-info-circle me-1"></i> Solo se muestran proyectos aprobados con cupos disponibles según Aval.
                    </div>
                </div>
            </div>

            <div class="card card-form p-4 mb-4">
                <h5 class="text-primary border-bottom pb-2 mb-4">2. Tipo de Vinculación</h5>
                
                <div class="row g-3 justify-content-center">
                    
                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="tipoRol" id="rolAyudante" value="ayudante" autocomplete="off" checked onchange="cambiarFormulario()">
                        <label class="card role-selector p-3 text-center h-100" for="rolAyudante">
                            <i class="bi bi-backpack4 fs-1 text-primary mb-2"></i>
                            <h6 class="fw-bold text-primary">Estudiante Ayudante</h6>
                            <p class="small text-muted mb-0">Estudiante de pregrado para apoyo académico.</p>
                        </label>
                    </div>

                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="tipoRol" id="rolAsistente" value="asistente" autocomplete="off" onchange="cambiarFormulario()">
                        <label class="card role-selector p-3 text-center h-100" for="rolAsistente">
                            <i class="bi bi-person-badge fs-1 text-success mb-2"></i>
                            <h6 class="fw-bold text-success">Asistente de Investigación</h6>
                            <p class="small text-muted mb-0">Profesional graduado para labores investigativas.</p>
                        </label>
                    </div>

                    <div class="col-md-4">
                        <input type="radio" class="btn-check" name="tipoRol" id="rolTecnico" value="tecnico" autocomplete="off" onchange="cambiarFormulario()">
                        <label class="card role-selector p-3 text-center h-100" for="rolTecnico">
                            <i class="bi bi-tools fs-1 text-secondary mb-2"></i>
                            <h6 class="fw-bold text-secondary">Técnico de Proyecto</h6>
                            <p class="small text-muted mb-0">Personal técnico o de laboratorio especializado.</p>
                        </label>
                    </div>
                </div>
            </div>

            <div class="card card-form p-4 mb-4">
                <h5 class="text-primary border-bottom pb-2 mb-4">3. Datos Personales</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Cédula / Pasaporte <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="17..." required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Apellidos y Nombres Completos <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Institucional</label>
                        <input type="email" class="form-control" placeholder="@uce.edu.ec">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono de Contacto</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha de Inicio <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="card card-form p-4 mb-4 bg-light border">
                <h5 class="text-dark border-bottom pb-2 mb-4" id="titulo-especifico">4. Información Académica (Ayudante)</h5>
                
                <div id="form-ayudante" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Carrera <span class="text-danger">*</span></label>
                        <select class="form-select">
                            <option>Ingeniería de Software</option>
                            <option>Sistemas de Información</option>
                            <option>Computación</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Semestre</label>
                        <select class="form-select">
                            <option>3ro</option><option>4to</option><option>5to</option>
                            <option>6to</option><option>7mo</option><option>8vo</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Promedio Global</label>
                        <input type="number" step="0.01" class="form-control" placeholder="Ej: 8.5">
                    </div>
                </div>

                <div id="form-asistente" class="row g-3 hidden-section">
                    <div class="col-md-8">
                        <label class="form-label">Título Profesional (Senescyt) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Ej: Ingeniero en Sistemas Informáticos">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Año de Graduación</label>
                        <input type="number" class="form-control" placeholder="2023">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Enlace a CV / LinkedIn</label>
                        <input type="url" class="form-control" placeholder="https://...">
                    </div>
                </div>

                <div id="form-tecnico" class="row g-3 hidden-section">
                    <div class="col-md-6">
                        <label class="form-label">Especialidad Técnica <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Ej: Redes y Telecomunicaciones">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Certificaciones</label>
                        <input type="text" class="form-control" placeholder="Ej: CCNA, AWS Cloud...">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Años de Experiencia</label>
                        <select class="form-select w-auto">
                            <option>Menos de 1 año</option>
                            <option>1 - 3 años</option>
                            <option>Más de 3 años</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-3 mb-5">
                <a href="listaAyudantes.html" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-save px-4 shadow-sm">
                    <i class="bi bi-save me-2"></i> Registrar Personal
                </button>
            </div>
        </form>
    </div>

    <script>
        // 1. LÓGICA DE PRE-SELECCIÓN AUTOMÁTICA (Desde Lista de Proyectos)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectCode = urlParams.get('project'); // Ej: ?project=VIN-24-01
            
            if(projectCode) {
                const select = document.getElementById('selectProyecto');
                // Busca la opción que tenga ese valor
                for (let i = 0; i < select.options.length; i++) {
                    // Comparamos el value (INV-24-01) o el texto si prefieres
                    if (select.options[i].value === projectCode) {
                        select.selectedIndex = i;
                        // Feedback visual para que sepa que se seleccionó solo
                        select.classList.add('bg-success-subtle', 'border-success', 'fw-bold'); 
                        break;
                    }
                }
            }
        });

        // 2. LÓGICA DE CAMBIO DE FORMULARIO (Roles)
        function cambiarFormulario() {
            // Elementos
            const esAyudante = document.getElementById('rolAyudante').checked;
            const esAsistente = document.getElementById('rolAsistente').checked;
            const esTecnico = document.getElementById('rolTecnico').checked;

            const divAyudante = document.getElementById('form-ayudante');
            const divAsistente = document.getElementById('form-asistente');
            const divTecnico = document.getElementById('form-tecnico');
            const titulo = document.getElementById('titulo-especifico');

            // Resetear visibilidad
            divAyudante.classList.add('hidden-section');
            divAsistente.classList.add('hidden-section');
            divTecnico.classList.add('hidden-section');

            // Mostrar el correcto
            if (esAyudante) {
                divAyudante.classList.remove('hidden-section');
                titulo.innerText = "4. Información Académica (Ayudante Estudiante)";
            } else if (esAsistente) {
                divAsistente.classList.remove('hidden-section');
                titulo.innerText = "4. Perfil Profesional (Asistente de Investigación)";
            } else if (esTecnico) {
                divTecnico.classList.remove('hidden-section');
                titulo.innerText = "4. Perfil Técnico (Soporte y Laboratorio)";
            }
        }

        // 3. SIMULACIÓN DE GUARDADO
        function guardarAyudante(event) {
            event.preventDefault();
            const btn = document.querySelector('.btn-save');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';
            
            setTimeout(() => {
                alert("¡Registro exitoso!\nEl nuevo integrante ha sido vinculado al proyecto.");
                // Volver a la lista
                window.location.href = 'listaAyudantes.html';
            }, 1000);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
