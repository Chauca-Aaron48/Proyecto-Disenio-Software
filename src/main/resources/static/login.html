<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background: linear-gradient(135deg, #0f52ba 0%, #052c65 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        .card-header-login {
            background-color: white;
            padding: 30px 20px 10px;
            text-align: center;
            border-bottom: none;
        }
        /* Estilos para botones de rol */
        .btn-role {
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-role:hover { transform: translateY(-2px); }
        
        .divider-text {
            display: flex;
            align-items: center;
            text-align: center;
            color: #888;
            font-size: 0.8rem;
            margin: 15px 0;
        }
        .divider-text::before, .divider-text::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider-text:not(:empty)::before { margin-right: .5em; }
        .divider-text:not(:empty)::after { margin-left: .5em; }

    </style>
</head>
<body>

    <div class="card card-login">
        
        <div class="card-header-login">
            <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3.5rem;"></i>
            <h3 class="fw-bold text-dark mt-2">SGP Académico</h3>
            <p class="text-muted small">Sistema de Gestión de Proyectos</p>
        </div>

        <div class="card-body p-4">
            
            <div class="alert alert-info small text-center mb-4">
                <i class="bi bi-info-circle me-1"></i> Seleccione su rol para ingresar:
            </div>

            <div class="d-grid gap-3">
                
                <button type="button" class="btn btn-primary btn-role shadow-sm" onclick="login('docente')">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="bi bi-person-video3 fs-4 me-3"></i>
                        <div class="text-start">
                            <div style="font-size: 0.75rem; opacity: 0.8;">ACCESO</div>
                            <div>DOCENTE TUTOR</div>
                        </div>
                    </div>
                </button>

                <div class="divider-text">O</div>

                <button type="button" class="btn btn-dark btn-role shadow-sm" onclick="login('jefatura')">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="bi bi-building-fill-lock fs-4 me-3"></i>
                        <div class="text-start">
                            <div style="font-size: 0.75rem; opacity: 0.8;">ACCESO</div>
                            <div>JEFATURA / DIRECCIÓN</div>
                        </div>
                    </div>
                </button>

            </div>

            <div class="mt-4 text-center">
                <a href="#" class="text-decoration-none small text-muted">¿Necesita soporte técnico?</a>
            </div>
        </div>

        <div class="card-footer bg-light text-center py-3">
            <small class="text-muted">Escuela Politécnica Nacional &copy; 2026</small>
        </div>
    </div>

    <script>
        function login(rol) {
            // Simulamos un pequeño tiempo de carga para realismo
            const card = document.querySelector('.card-body');
            const originalContent = card.innerHTML;
            
            card.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted fw-bold">Autenticando como ${rol.toUpperCase()}...</p>
                </div>
            `;

            setTimeout(() => {
                if(rol === 'docente') {
                    // Redirige al nuevo dashboard que creaste
                    window.location.href = 'indexDocente.html';
                } else {
                    // Redirige al dashboard de control (antiguo index)
                    window.location.href = 'indexJefatura.html'; 
                }
            }, 800); // 0.8 segundos de delay
        }
    </script>

</body>
</html>
