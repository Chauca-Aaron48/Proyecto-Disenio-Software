<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Listado y Control de Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { --sgp-blue: #0f52ba; }
        body { background-color: #f4f6f9; }

        .navbar-sgp { background-color: var(--sgp-blue); }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }

        /* HEADER */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* TABLA */
        .card-table { border: none; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
        .table-proyectos th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            vertical-align: middle;
        }
        .table-proyectos td { vertical-align: middle; font-size: 0.95rem; }
        
        /* ESTADOS DE PROYECTO */
        .badge-status { padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; letter-spacing: 0.5px; }
        .st-verde { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .st-naranja { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
        .st-rojo { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }

        /* FECHAS Y PLAZOS (Lo nuevo) */
        .deadline-box { font-weight: 600; color: #333; }
        .deadline-countdown { font-size: 0.8rem; display: block; }
        .text-urgent { color: #dc3545; font-weight: 700; } /* Rojo fuerte */
        .text-warning-dark { color: #d68c08; font-weight: 600; } /* Naranja oscuro */
        .text-safe { color: #198754; } /* Verde */

        /* BOTONES ACCIÓN */
        .btn-validar {
            background-color: var(--sgp-blue); 
            color: white; 
            font-size: 0.85rem; 
            border-radius: 4px; 
            padding: 5px 12px;
            white-space: nowrap;
        }
        .btn-validar:hover { background-color: #0a3d8f; color: white; }
        
        .action-icon { cursor: pointer; color: #6c757d; transition: 0.2s; }
        .action-icon:hover { color: var(--sgp-blue); transform: scale(1.1); }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-sgp mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-4" href="index.html">
                <i class="bi bi-arrow-left me-2 fs-5"></i>SGP Académico
            </a>
            <div class="d-flex text-white align-items-center ms-auto">
                <span class="me-3">Dr. Juan Pérez (Docente)</span>
                <i class="bi bi-person-circle fs-3"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        
        <div class="page-header">
            <div>
                <h3 class="fw-bold text-dark m-0">Control de Proyectos</h3>
                <p class="text-muted small mb-0">Periodo Actual: Enero 2026</p>
            </div>
            <button class="btn btn-primary shadow-sm" onclick="window.location.href='registroProyecto.html'">
                <i class="bi bi-plus-lg me-1"></i> Registrar Proyecto
            </button>
        </div>

        <div class="card card-table mb-4 p-3">
            <div class="row g-2">
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Buscar proyecto...">
                </div>
                <div class="col-md-3">
                    <select class="form-select text-secondary">
                        <option>Estado: Todos</option>
                        <option>Pendientes de Validar</option>
                        <option>Al día</option>
                        <option>Vencidos</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card card-table">
            <div class="table-responsive">
                <table class="table table-proyectos table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width: 10%;">Código</th>
                            <th style="width: 25%;">Proyecto</th>
                            <th style="width: 15%;">Tutor</th>
                            <th style="width: 10%;">Tipo</th>
                            <th style="width: 15%;">Cierre de Mes (Límite)</th> <th style="width: 10%;" class="text-center">Estado Mes</th>
                            <th style="width: 15%;">Acción Requerida</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // DATOS MOCK CON FECHAS DE CADUCIDAD
        const proyectos = [
            {
                codigo: "VIN-24-01",
                nombre: "Sistema de IA para detección de plagas",
                tutor: "Dra. Ana Ruiz",
                tipo: "Investigación",
                limite: "30/01/2026", // Fecha futura
                estadoMes: "pendiente", // Aún no valida este mes
                diasRestantes: 5 // Calculado por el backend
            },
            {
                codigo: "VINC-23-15",
                nombre: "Programa de Alfabetización Digital",
                tutor: "Msc. Carlos Díaz",
                tipo: "Vinculación",
                limite: "30/01/2026",
                estadoMes: "aldia", // YA validó este mes
                diasRestantes: 5
            },
            {
                codigo: "TD-23-08",
                nombre: "Migración a Nube Híbrida",
                tutor: "Ing. Pedro Soto",
                tipo: "Transformación",
                limite: "31/12/2025", // Fecha PASADA
                estadoMes: "vencido", // Se le olvidó validar el mes pasado
                diasRestantes: -18
            },
            {
                codigo: "INV-24-03",
                nombre: "Análisis de Datos Climáticos",
                tutor: "Dr. Juan Pérez",
                tipo: "Investigación",
                limite: "30/01/2026",
                estadoMes: "pendiente",
                diasRestantes: 2 // Urgente
            }
        ];

        function renderTabla() {
            const tbody = document.getElementById('tabla-body');
            let html = '';

            proyectos.forEach(p => {
                let fechaHTML = '';
                let estadoBadge = '';
                let accionHTML = '';

                // 1. LÓGICA DE FECHAS (Semáforo de tiempo)
                if (p.estadoMes === 'aldia') {
                    // Si ya cumplió, la fecha sale normal
                    fechaHTML = `
                        <div class="deadline-box text-muted">${p.limite}</div>
                        <span class="deadline-countdown text-success"><i class="bi bi-check-all"></i> Completado</span>
                    `;
                    estadoBadge = '<span class="badge badge-status st-verde">AL DÍA</span>';
                    accionHTML = `<button class="btn btn-sm btn-outline-secondary border-0" disabled><i class="bi bi-check-lg"></i> Validado</button>`;
                
                } else if (p.estadoMes === 'vencido') {
                    // Si se pasó de la fecha
                    fechaHTML = `
                        <div class="deadline-box text-danger">${p.limite}</div>
                        <span class="deadline-countdown text-urgent">Venció hace ${Math.abs(p.diasRestantes)} días</span>
                    `;
                    estadoBadge = '<span class="badge badge-status st-rojo">ATRASADO</span>';
                    // Botón rojo llamativo
                    accionHTML = `
                        <button class="btn btn-validar bg-danger border-danger" onclick="validar('${p.codigo}')">
                            <i class="bi bi-exclamation-circle"></i> Regularizar
                        </button>`;

                } else {
                    // Si está pendiente (A tiempo o Urgente)
                    let colorTexto = p.diasRestantes <= 3 ? 'text-warning-dark' : 'text-muted';
                    let textoDias = p.diasRestantes <= 3 ? `¡Cierra en ${p.diasRestantes} días!` : `Quedan ${p.diasRestantes} días`;
                    
                    fechaHTML = `
                        <div class="deadline-box">${p.limite}</div>
                        <span class="deadline-countdown ${colorTexto}">${textoDias}</span>
                    `;
                    estadoBadge = '<span class="badge badge-status st-naranja">PENDIENTE</span>';
                    // Botón azul estándar
                    accionHTML = `
                        <button class="btn btn-validar" onclick="validar('${p.codigo}')">
                            <i class="bi bi-check2-square"></i> Validar Mes
                        </button>`;
                }

                html += `
                    <tr>
                        <td class="small text-muted fw-bold">${p.codigo}</td>
                        <td class="fw-medium">${p.nombre}</td>
                        <td>${p.tutor}</td>
                        <td><span class="badge bg-light text-dark border">${p.tipo}</span></td>
                        
                        <td>${fechaHTML}</td>
                        
                        <td class="text-center">${estadoBadge}</td>
                        
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                ${accionHTML}
                                <i class="bi bi-three-dots-vertical action-icon ms-2" title="Más opciones"></i>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Lógica del Botón Validar
        function validar(codigo) {
            // Aquí es donde conectamos con la lógica que me pediste antes:
            // Preguntar si hay cambios antes de validar.
            if(confirm(`Validación de Mes para ${codigo}:\n\n¿La nómina de estudiantes se mantiene IGUAL para este periodo?\n\n[Aceptar] = Sí, validar automáticamente.\n[Cancelar] = No, necesito registrar cambios.`)) {
                alert("¡Listo! Se ha registrado la validación automática. El proyecto queda 'Al Día'.");
                // Aquí recargaríamos la tabla para ponerlo verde
            } else {
                // Redirige a la pantalla de gestión que hicimos antes
                // window.location.href = 'consulta.html?modo=editar'; // Ejemplo
                alert("Redirigiendo a la gestión de nómina para registrar altas/bajas...");
            }
        }

        document.addEventListener('DOMContentLoaded', renderTabla);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
