<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Cierre de Periodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { --sgp-blue: #0f52ba; }
        body { background-color: #f4f6f9; }

        .navbar-sgp { background-color: var(--sgp-blue); }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }

        /* Estilos de la Matriz */
        .card-report { border: none; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .table-matrix th {
            background-color: #f8f9fa;
            color: #555;
            font-size: 0.85rem;
            text-align: center;
            vertical-align: middle;
        }
        .table-matrix td { vertical-align: middle; font-size: 0.9rem; }

        /* Celdas de Meses */
        .cell-month { text-align: center; cursor: default; }
        
        .status-dot {
            height: 25px;
            width: 25px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .dot-ok { background-color: #d1e7dd; color: #198754; } /* Validado */
        .dot-miss { background-color: #f8d7da; color: #dc3545; cursor: pointer; } /* Faltante */
        .dot-future { background-color: #e9ecef; color: #adb5bd; } /* Aún no llega */

        /* Botón de Firma */
        .btn-sign { background-color: var(--sgp-blue); color: white; }
        .btn-sign:disabled { background-color: #6c757d; border-color: #6c757d; }

        /* Barra de Progreso */
        .progress-thin { height: 6px; border-radius: 3px; margin-top: 5px; }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-sgp mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-4" href="indexJefatura.html">
                <i class="bi bi-arrow-left me-2 fs-5"></i>SGP Académico
            </a>
            <div class="d-flex text-white align-items-center ms-auto">
                <span class="me-3 small text-uppercase opacity-75">Jefatura</span>
                <span class="me-3">Reporte de Cierre</span>
                <i class="bi bi-clipboard-data fs-3"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h3 class="fw-bold text-dark m-0">Matriz de Cumplimiento Semestral</h3>
                <p class="text-muted small mb-0">Requisito para firma de Informes de Avance</p>
            </div>
            <div class="d-flex gap-2">
                <select class="form-select w-auto">
                    <option>Periodo: 2026-I</option>
                    <option>Periodo: 2025-II</option>
                </select>
                <button class="btn btn-outline-success" onclick="window.print()">
                    <i class="bi bi-printer me-2"></i>Imprimir
                </button>
            </div>
        </div>

        <div class="card card-report p-0">
            <div class="table-responsive">
                <table class="table table-hover table-matrix mb-0">
                    <thead>
                        <tr>
                            <th style="width: 25%; text-align: left; padding-left: 20px;">Proyecto / Tutor</th>
                            <th style="width: 10%;">Enero</th>
                            <th style="width: 10%;">Febrero</th>
                            <th style="width: 10%;">Marzo</th>
                            <th style="width: 10%;">Abril</th>
                            <th style="width: 10%;">Mayo</th>
                            <th style="width: 10%;">Cumplimiento</th>
                            <th style="width: 15%;">Acción Final</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-matriz">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // DATOS MOCK: Situación al final del semestre
        const matriz = [
            {
                proyecto: "Sistema de IA para detección de plagas",
                codigo: "INV-24-01",
                tutor: "Dra. Ana Ruiz",
                meses: [true, true, true, true, true], // Todo OK
                porcentaje: 100
            },
            {
                proyecto: "Capacitación TIC Rural",
                codigo: "VIN-26-02",
                tutor: "Msc. Maria Gómez",
                // Faltó validar el 3er mes (Marzo)
                meses: [true, true, false, true, true], 
                porcentaje: 80
            },
            {
                proyecto: "Digitalización Archivos",
                codigo: "TD-26-01",
                tutor: "Ing. Pedro Soto",
                // Un desastre, faltan casi todos
                meses: [true, false, false, false, false], 
                porcentaje: 20
            }
        ];

        function renderMatriz() {
            const tbody = document.getElementById('tabla-matriz');
            let html = '';

            matriz.forEach(m => {
                let celdasMeses = '';
                
                // Generar los puntitos de los meses
                m.meses.forEach((status, index) => {
                    if(status) {
                        celdasMeses += `<td class="cell-month"><span class="status-dot dot-ok" title="Validado"><i class="bi bi-check"></i></span></td>`;
                    } else {
                        celdasMeses += `<td class="cell-month"><span class="status-dot dot-miss" title="Falta Validación" onclick="alert('El mes de Marzo no fue validado por el docente.')"><i class="bi bi-x"></i></span></td>`;
                    }
                });

                // Lógica del Botón de Firma
                let botonAccion = '';
                let colorBarra = '';

                if(m.porcentaje === 100) {
                    botonAccion = `
                        <button class="btn btn-sm btn-sign w-100" onclick="firmar('${m.codigo}')">
                            <i class="bi bi-pen-fill me-2"></i>Autorizar Avance
                        </button>`;
                    colorBarra = 'bg-success';
                } else {
                    botonAccion = `
                        <button class="btn btn-sm btn-outline-secondary w-100" disabled>
                            <i class="bi bi-lock-fill me-2"></i>Incompleto
                        </button>`;
                    if(m.porcentaje > 50) colorBarra = 'bg-warning';
                    else colorBarra = 'bg-danger';
                }

                html += `
                    <tr>
                        <td style="padding-left: 20px;">
                            <div class="fw-bold text-primary">${m.proyecto}</div>
                            <div class="small text-muted">${m.tutor} | <span class="badge bg-light text-dark border">${m.codigo}</span></div>
                        </td>
                        ${celdasMeses}
                        <td class="text-center align-middle">
                            <div class="fw-bold small">${m.porcentaje}%</div>
                            <div class="progress progress-thin">
                                <div class="progress-bar ${colorBarra}" role="progressbar" style="width: ${m.porcentaje}%"></div>
                            </div>
                        </td>
                        <td class="text-center px-3">
                            ${botonAccion}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function firmar(codigo) {
            if(confirm("¿Está seguro de autorizar el Informe de Avance del proyecto " + codigo + "?\n\nEl sistema certifica que el docente ha cumplido con todas las validaciones de nómina mensuales.")) {
                alert("¡Autorización Exitosa!\nSe ha generado el certificado digital para el docente.");
            }
        }

        document.addEventListener('DOMContentLoaded', renderMatriz);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
